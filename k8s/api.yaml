apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-relay
spec:
  replicas: 2
  selector:
    matchLabels: {app: agent-relay}
  template:
    metadata:
      labels: {app: agent-relay}
    spec:
      containers:
        - name: api
          image: agent-relay:local
          imagePullPolicy: IfNotPresent
          env:
            - name: RELAY_DATABASE_URL
              value: postgresql+psycopg://relay:relay@postgres:5432/relay
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: {path: /ready, port: 8000}
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: agent-relay
spec:
  type: NodePort
  selector: {app: agent-relay}
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
